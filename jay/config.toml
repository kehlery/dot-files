keymap = """
    xkb_keymap {
        xkb_keycodes { include "evdev+aliases(qwerty)" };
        xkb_types    { include "complete"              };
        xkb_compat   { include "complete"              };
        xkb_symbols  { include "pc+us+inet(evdev)"     };
    };
    """

on-startup = [
    { type = "exec", exec = "gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'" }
    { type = "exec", exec = "gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'" }
]

on-graphics-initialized = [
    { type = "exec", exec = "mako" },
    { type = "exec", exec = "wl-tray-bridge" },
    { type = "exec", exec = "i3status" },
]



workspace-display-order = "sorted"
fallback-output-mode = "focus"


focus-follows-mouse = false
middle-click-paste = false
repeat-rate = { rate = 50, delay = 180}
user-hardware-cursor = false

## Graphics Init

[[drm-devices]]
match = { pci-vendor = 0x10de, pci-model = 0x1e87 }
gfx-api = "Vulkan"

## Inputs



[[inputs]]
match.is-pointer = true
accel-profile = "Flat"
accel-speed = -0.75

## Environment Variables

[env]
GTK_THEME = "Adwaita:dark"
QT_QPA_PLATFORM = "wayland"
SDL_VIDEODRIVER="wayland"
CLUTTER_BACKEND="wayland"
ELECTRON_OZONE_PLATFORM_HINT="wayland"
XDG_SESSION_TYPE="wayland"
MOZ_ENABLE_WAYLAND = "1"
GDM_BACKEND="nvidia-drm"
__GLX_VENDOR_LIBRARY_NAME="nvidia"
LIBVA_DRIVER_NAME="nvidia"

## Status Bar

[status]
format = "i3bar"
exec = "i3status"

## Outputs

[[outputs]]
name = main
march.serial-number = "HCJW200015"
mode = {width = 1920, height = 1080, refresh-rate = 239.76 }
vrr.mode = "never"
tearing.mode = "variant1"

[theme]
show-bar = true
show-titles = false
bar-position = "bottom"
border-width = 1
font = "Iosevka Mono 8"

## Colors

bar-status-text-color = "#888888"
bar-bg-color = "#222222"

[[windows]]
name = "waywall"
match.app-id = "waywall"
match.just-mapped = true
action = [ { type = "move-to-workspace", name = "4" }, { type = "show-workspace", name = "4" }, "enter-fullscreen" ]


[shortcuts]

### Defaults ###

## Windows

F23 = "none"
F24 = { type = "push-mode", name = "disabled" }

logo-h = "focus-left"
logo-j = "focus-down"
logo-k = "focus-up"
logo-l = "focus-right"

